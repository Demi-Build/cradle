name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rust:
    name: Rust (fmt / clippy / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri-build's build.rs validates `bundle.resources` paths in
      # tauri.conf.json on every cargo invocation. The rust job doesn't
      # bundle anything, but clippy/test/build all trigger build.rs — so
      # the resource path needs to exist as at least an empty dir.
      # Real demo content is fetched only by the `tauri-build` job and
      # the release workflow.
      - name: Stub demo resource path
        working-directory: ${{ github.workspace }}
        run: mkdir -p bibles/mazeworld_5_room_demo

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --lib

      # Catch release-mode Rust breakage on PRs instead of waiting until a
      # tag push fires the release workflow. No signing, no bundling — just
      # `cargo build --release` on the crate.
      - run: cargo build --release

  tauri-build:
    name: Tauri end-to-end build (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Demo content lives outside the repo (~1 GB, gitignored) and is
      # distributed as a tarball asset on a dedicated demo-v* GitHub Release.
      # Same step in release.yml.
      - name: Fetch bundled demo
        env:
          DEMO_TAG: demo-v0.1.0
        run: bash scripts/fetch-demo.sh

      # Full Tauri integration build: frontend -> tsc -> vite build,
      # then cargo build on src-tauri. --debug skips release opts;
      # --no-bundle skips installer/signing. Catches Rust compile errors
      # and Tauri config breakage that `cargo test --lib` misses.
      - run: npx tauri build --debug --no-bundle
