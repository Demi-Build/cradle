[package]
name = "cradle"
version = "0.1.0"
description = "Read-only desktop inspector for worlds generated by canon"
authors = ["Wolfgang Black"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cradle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.0"
# Row P0-12 / W3.4 — provider keys in the OS keychain. The CRATE, not a Tauri
# plugin, matching this file's existing raw `std::process::Command` precedent.
# The default `v1` feature picks the platform store per target: macOS Keychain
# Services, Windows Credential Manager, Secret Service on *nix — and reports a
# missing Secret Service as a status rather than a panic, which is what
# `keys.rs` turns into the loud unencrypted fallback.
keyring = "4"

[dev-dependencies]
tempfile = "3"

