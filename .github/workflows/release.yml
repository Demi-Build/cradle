name: Release

# Triggered by pushing a v* tag — either via `git tag v0.1.0 && git push --tags`
# or by publishing a release in the GitHub web UI (which creates the tag).
on:
  push:
    tags:
      - "v*"

jobs:
  create-release:
    name: Create draft GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: context.ref.replace('refs/tags/', ''),
              body: 'See the assets to download and install this version.',
              draft: true,
              prerelease: false,
            });
            return data.id;
          result-encoding: string

  build-tauri:
    name: Build (${{ matrix.platform }})
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS universal binary (Intel + Apple Silicon), signed with the
          # Developer ID identity in src-tauri/tauri.conf.json and notarized
          # via the APPLE_* env vars on tauri-action below.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          # Pinned to ubuntu-22.04 (not ubuntu-latest) because AppImages built
          # on 24.04 link against a glibc too new for many user systems.
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Intel macOS target for universal build
        if: matrix.platform == 'macos-latest'
        run: rustup target add x86_64-apple-darwin

      - name: Install Linux Tauri deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Demo content lives outside the repo (~1 GB, gitignored) and is
      # distributed as a tarball asset on a dedicated demo-v* GitHub Release.
      # Bump DEMO_TAG when a new demo version ships. Same step in ci.yml.
      - name: Fetch bundled demo
        shell: bash
        env:
          DEMO_TAG: demo-v0.1.0
        run: bash scripts/fetch-demo.sh

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS Developer ID signing + notarization. tauri-action runs
          # `security import` on the base64-decoded .p12 and notarizes
          # automatically when APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
          # are present. See docs/RELEASE.md for how to provision these.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          # TODO(signing - Windows): wire these up when a code-signing cert
          # is available.
          #   WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          #   WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # TODO(signing - Tauri updater): wire these up when shipping
          # auto-updates via the Tauri updater plugin.
          #   TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish-release:
    name: Publish GitHub Release
    needs: [create-release, build-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Flip draft release to published
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.RELEASE_ID,
              draft: false,
              prerelease: false,
            });
